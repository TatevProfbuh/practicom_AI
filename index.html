<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ИИ для бухгалтера · вебинар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: sticky step-rail on top, one "screen" per step routed by #hash, presenter arrows ← → */
:root{
  --milk:#F4EEE9; --paper:#FBF8F4; --ink:#2E2A28; --ink-2:#5E544E; --ink-3:#8A7F78;
  --blue:#7FAEC6; --blue-deep:#3E6F88; --blue-soft:#E3EEF3;
  --terra:#C56245; --terra-deep:#A64D34; --terra-soft:#F3E1D9;
  --line:#E2D8D0;
  --f-text:'Manrope', Arial, sans-serif;
  --f-big:'Playfair Display', Georgia, serif;
  --f-it:'Cormorant Garamond', Georgia, serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--milk);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--milk)}
a{color:var(--terra-deep)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue-deep);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto}
.it{font-family:var(--f-it);font-style:italic;font-weight:500;color:var(--terra)}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--terra-deep)}
.muted{color:var(--ink-2)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-big);font-weight:600;font-size:clamp(40px,6.4vw,84px);line-height:1.02;letter-spacing:-.01em}
h2{font-family:var(--f-big);font-weight:600;font-size:clamp(30px,4.2vw,54px);line-height:1.08}
h3{font-size:19px;font-weight:700;line-height:1.3}
p{margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--milk) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.bar-in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;gap:18px;padding:10px max(16px, env(safe-area-inset-left, 0px))}
.plate{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;font-weight:700;white-space:nowrap}
.plate img{height:30px;width:auto}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:none;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid transparent;display:flex;gap:8px;align-items:center}
.rail a .n{font-family:var(--f-big);color:var(--blue-deep);font-size:15px}
.rail a:hover{border-color:var(--line);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.rail a[aria-current="page"] .n{color:var(--blue)}

/* views */
.view{padding-top:48px;display:flex;flex-direction:column;gap:40px;animation:rise .45s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.head{display:flex;flex-direction:column;gap:14px;max-width:860px}
.lead{font-size:20px;line-height:1.55;color:var(--ink-2);max-width:720px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}
.grid2>*{min-width:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px}
.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dark .muted{color:#CFC4BC}
.say{border-left:3px solid var(--blue);padding:4px 0 4px 18px;color:var(--ink-2);font-size:15px}
.say b{color:var(--ink)}
.next{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 24px;font-weight:700;text-decoration:none}
.next:hover{background:var(--terra-deep)}
.btn{background:var(--paper);border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.chip:hover,.chip[aria-pressed="true"]{border-color:var(--terra);color:var(--terra-deep);background:var(--terra-soft)}
.icon{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* home */
.hero{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:center}
.hero>*{min-width:0}
.hero img{width:100%;height:auto;max-width:360px}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero img{max-width:240px}}
.reality{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.reality>div{padding:22px 22px 22px 0;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
@media (max-width:860px){.reality{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.reality{grid-template-columns:1fr}}
.reality h3{font-family:var(--f-big);font-weight:600;font-size:22px}
.stairs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end}
.stairs a{text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;transition:transform .2s, border-color .2s}
.stairs a:hover{transform:translateY(-4px);border-color:var(--blue)}
.stairs a .num{font-family:var(--f-big);font-size:44px;line-height:1;color:var(--blue-deep)}
.stairs a.top{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stairs a.top .num{color:var(--blue)}
.stairs a .muted{font-size:14px}
.stairs a.top .muted{color:#CFC4BC}
@media (min-width:861px){.stairs a:nth-child(1){min-height:170px}.stairs a:nth-child(2){min-height:210px}.stairs a:nth-child(3){min-height:250px}.stairs a:nth-child(4){min-height:290px}.stairs a:nth-child(5){min-height:330px}}
@media (max-width:860px){.stairs{grid-template-columns:1fr 1fr}}

/* prompt builder */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
select,textarea,input[type=text],input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--milk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;accent-color:var(--terra)}
.out{white-space:pre-wrap;font-size:15.5px;line-height:1.6;background:var(--milk);border-radius:12px;padding:18px;border:1px dashed var(--blue)}
.dark .out{background:#3A3532;border-color:#5E544E;color:var(--paper)}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.formula span{background:var(--blue-soft);color:var(--blue-deep);padding:6px 12px;border-radius:8px}
.formula i{font-style:normal;color:var(--ink-3)}

/* calculator + KP */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.calc .full{grid-column:1/-1}
@media (max-width:480px){.calc{grid-template-columns:1fr}}
.price{font-family:var(--f-big);font-size:clamp(40px,5vw,60px);line-height:1;font-variant-numeric:tabular-nums}
.kp{background:#fff;color:var(--ink);border-radius:6px;padding:28px;box-shadow:0 18px 40px -20px rgba(46,42,40,.45);display:flex;flex-direction:column;gap:14px;font-size:14.5px}
.kp .kp-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--terra);padding-bottom:12px;gap:12px}
.kp img{height:38px;width:auto}
.kp table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.kp td{padding:7px 0;border-bottom:1px solid var(--line)}
.kp td:last-child{text-align:right;white-space:nowrap}
.kp .total td{font-weight:700;border-bottom:0;font-size:16px}
.note{font-size:13px;color:var(--ink-3)}
video{width:100%;border-radius:14px;background:var(--ink);display:block;max-width:100%}
.vframe{max-width:300px;width:100%;margin-inline:auto}

/* chat mock */
.chat{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:86%;padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.5;animation:rise .35s ease both}
.msg.me{align-self:flex-end;background:var(--blue);color:var(--ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
.dark .msg.bot{background:#3A3532;color:var(--paper);border-color:#5E544E}
.msg .src{display:block;margin-top:6px;font-size:12.5px;color:var(--terra-deep);font-weight:600}
.dark .msg .src{color:#E8A189}
.doc{align-self:flex-start;background:#fff;color:var(--ink);border-radius:10px;padding:16px 18px;width:min(100%,380px);border-top:3px solid var(--terra);font-size:14px;animation:rise .35s ease both}
.doc b{font-size:15px}
.who{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dark .who{color:#B3A79F}

/* flow */
.flow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.flow>div{flex:1 1 150px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.flow>div b{font-size:15px}
.flow>div span{font-size:14px;color:var(--ink-2)}
.flow .arrow{flex:0 0 auto;background:none;border:0;padding:0;align-self:center;color:var(--terra);font-size:22px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tabs button .icon{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.swatches{grid-template-columns:1fr 1fr}}
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.sw div{height:90px}
.sw p{padding:10px 12px;font-size:13px}
.sw p b{display:block;font-size:14px}
.typeset{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.typeset{grid-template-columns:1fr}}
.typeset>div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps>div{counter-increment:s;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.steps>div::before{content:counter(s);font-family:var(--f-big);font-size:28px;color:var(--blue-deep);line-height:1}
.steps>div b{font-size:15px}
.steps>div span{font-size:13.5px;color:var(--ink-2)}
.week{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px}
.weekwrap{overflow-x:auto}
.day{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.day .d{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.post{font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px;line-height:1.3}
.post.reels{background:var(--blue-soft);color:var(--blue-deep)}
.post.car{background:var(--terra-soft);color:var(--terra-deep)}
.post.text{background:#ECE6E0;color:var(--ink)}
.post.story{border:1px dashed var(--ink-3);color:var(--ink-2)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.metrics{grid-template-columns:1fr}}
.metric{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.metric .bar-m{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.metric .bar-m i{display:block;height:100%;background:var(--blue)}
.metric input{max-width:140px}

/* course */
.mods{display:flex;flex-direction:column;gap:10px}
details.mod{background:var(--paper);border:1px solid var(--line);border-radius:14px}
details.mod summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:16px;align-items:center}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary .n{font-family:var(--f-big);font-size:30px;color:var(--blue-deep);width:36px;flex:none}
details.mod summary .t{flex:1;min-width:0}
details.mod summary .t b{display:block;font-size:17px}
details.mod summary .t span{font-size:14px;color:var(--ink-2)}
details.mod summary .m{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
details.mod[open] summary{border-bottom:1px solid var(--line)}
details.mod ol{margin:0;padding:14px 20px 18px 72px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.mod ol li::marker{color:var(--terra)}
details.mod ol li span{color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (max-width:480px){details.mod ol{padding-left:40px}details.mod summary .m{display:none}}
.tariffs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:960px){.tariffs{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.tariffs{grid-template-columns:1fr}}
.tariff{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tariff.rec{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tariff .p{font-family:var(--f-big);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tariff s{color:var(--ink-3);font-size:14px}
.tariff.rec s{color:#B3A79F}
.tariff ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tariff .tag{align-self:flex-start;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--blue);color:var(--ink)}
.offer{background:var(--terra-deep);color:var(--paper);border-radius:18px;padding:28px;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between}
.offer h3{font-family:var(--f-big);font-weight:600;font-size:28px}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.faq>div{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.faq{grid-template-columns:1fr}}
.pay{margin-top:auto;align-self:stretch;text-align:center;text-decoration:none;font-weight:700;background:var(--terra-deep);color:var(--paper);border-radius:999px;padding:12px 18px}
.pay:hover{background:var(--ink)}
.tariff.rec .pay{background:var(--blue);color:var(--ink)}
.tariff.rec .pay:hover{background:var(--paper)}
.pay.big{align-self:auto;padding:14px 26px;font-size:17px;background:var(--paper);color:var(--terra-deep)}
.pay.ghost{background:transparent;color:var(--paper);border:1px solid var(--paper)}
.pay.big:hover{background:var(--ink);color:var(--paper)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.tg{grid-template-columns:1fr}}
.tg a{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink);background:var(--blue-soft);border:1px solid var(--blue);border-radius:16px;padding:20px 22px;min-width:0}
.tg a:hover{background:var(--blue)}
.tg a .icon{width:36px;height:36px;color:var(--blue-deep)}
.tg a>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.tg a b{font-size:18px}
.tg a .muted{font-size:15px;overflow-wrap:anywhere}
.tg-mini{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;font-weight:600}
.tg-mini a{text-decoration:none;color:var(--blue-deep)}
/* reels gallery + player */
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.reel{position:relative;border:0;padding:0;background:var(--paper);border-radius:14px;overflow:hidden;aspect-ratio:9/16;max-width:100%;box-shadow:0 10px 26px -18px rgba(46,42,40,.6);text-align:left;color:var(--paper);transition:transform .2s}
.reel:hover{transform:translateY(-3px)}
.reel img{width:100%;height:100%;object-fit:cover;display:block}
.reel .cap{position:absolute;inset:auto 0 0 0;padding:28px 10px 10px;font-size:12.5px;font-weight:600;line-height:1.3;background:linear-gradient(transparent,rgba(46,42,40,.88))}
.reel .play{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(46,42,40,.72);display:grid;place-items:center}
.reel .play::before{content:"";border-left:11px solid var(--paper);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.reels-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.player{position:fixed;inset:0;z-index:20;background:rgba(30,27,26,.86);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.player-in{display:flex;flex-direction:column;gap:10px;align-items:center;max-height:100%}
.player video{height:min(80vh,820px);width:auto;max-width:100%;aspect-ratio:9/16;border-radius:16px}
.player p{color:var(--paper);font-weight:600;max-width:460px;text-align:center}
.player .x{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));background:var(--paper);border:0;border-radius:999px;padding:8px 16px;font-weight:700}
.player .nav{display:flex;gap:10px}
.hero-reel{max-width:300px;width:100%;justify-self:center}
.hint{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));font-size:12px;color:var(--ink-3);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
@media (max-width:760px){.hint{display:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/><path d="M20.2 18.2 22 20"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></symbol>

/* ---------- behaviour ---------- */
const app = document.getElementById('app');
const rail = document.getElementById('rail');
rail.innerHTML = ROUTES.map(r=>`<a href="#${r.id}" data-r="${r.id}">${r.n?`<span class="n">${r.n}</span>`:''}${r.label}</a>`).join('');
let contentTab = 'brand';

function current(){ const h = location.hash.replace('#',''); return ROUTES.some(r=>r.id===h) ? h : 'home'; }
function render(){
  const id = current();
  app.innerHTML = id==='content' ? V.content(contentTab) : V[id]();
  rail.querySelectorAll('a').forEach(a=>{ if(a.dataset.r===id){a.setAttribute('aria-current','page'); a.scrollIntoView({block:'nearest',inline:'center'});} else a.removeAttribute('aria-current'); });
  window.scrollTo({top:0});
  wire(id);
}
function copy(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(()=>btn.textContent=o, 1400); };
  try { navigator.clipboard.writeText(text).then(done).catch(()=>selectFallback(btn)); } catch(e){ selectFallback(btn); }
}
function selectFallback(btn){ const el = btn.previousElementSibling; if(!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Выделено — нажмите ⌘C'; }

function wire(id){
  app.querySelectorAll('[data-copy-prev]').forEach(b=>b.addEventListener('click',()=>copy(b.previousElementSibling.textContent,b)));
  if(id==='chat') wireChat();
  if(id==='service') wireCalc();
  if(id==='agent') wireNoah();
  if(id==='content') wireContent();
  if(id==='onec') wireOnec();
}

function wireChat(){
  const $ = s=>document.getElementById(s);
  const build = () => {
    const parts = [`Ты — ${ROLES[$('pRole').value]}.`];
    if($('pCtx').value.trim()) parts.push(`Контекст: ${$('pCtx').value.trim()}`);
    if($('pTask').value.trim()) parts.push(`Задача: ${$('pTask').value.trim()}`);
    parts.push(`Формат: ${FORMATS[$('pFmt').value]}.`);
    if($('pCheck').checked) parts.push('Сошлись на конкретные статьи НК РФ и письма ведомств. Отдельным списком отметь, что нужно проверить по первоисточнику. Если данных не хватает — задай уточняющие вопросы.');
    $('pOut').textContent = parts.join('\n\n');
  };
  const load = i => { const e = EXAMPLES[i]; $('pRole').value=e.role; $('pCtx').value=e.ctx; $('pTask').value=e.task; $('pFmt').value=e.fmt;
    document.querySelectorAll('#exChips .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.ex==i)); build(); };
  document.getElementById('exChips').addEventListener('click',e=>{ const b=e.target.closest('[data-ex]'); if(b) load(+b.dataset.ex); });
  ['pRole','pCtx','pTask','pFmt','pCheck'].forEach(k=>$(k).addEventListener('input',build));
  $('pCopy').addEventListener('click',()=>{ const b=$('pCopy'); try{ navigator.clipboard.writeText($('pOut').textContent).then(()=>{$('pCopied').textContent='Скопировано';setTimeout(()=>$('pCopied').textContent='',1500)}).catch(()=>{$('pCopied').textContent='Выделите текст и скопируйте'}); }catch(e){ $('pCopied').textContent='Выделите текст и скопируйте'; } });
  load(1);
}

function wireCalc(){
  const $ = s=>document.getElementById(s);
  const v = s => Math.max(0, +$(s).value || 0);
  const calc = () => {
    const reg = REG[$('cReg').value];
    const rows = [[`Бухгалтерское и налоговое обслуживание (${reg[0]})`, reg[1]], [`Первичные документы и операции: ${v('cOps')}`, v('cOps')*v('rOp')]];
    if($('cKadr').checked) rows.push([`Кадровый учёт и зарплата: ${v('cEmp')} сотр.`, v('cEmp')*v('rEmp') + v('rKadr')]);
    if($('cVed').checked) rows.push(['Сопровождение ВЭД', v('rVed')]);
    const total = rows.reduce((s,r)=>s+r[1],0);
    $('kp').innerHTML = `
      <div class="kp-top"><div><p class="who">Коммерческое предложение</p><b style="font-size:17px">${esc($('cName').value || 'Клиент')}</b></div><img src="${LOGO}" alt="ТАТЕВ"></div>
      <p>Предлагаем ежемесячное бухгалтерское сопровождение. Состав работ и стоимость:</p>
      <table>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${rub(r[1])}</td></tr>`).join('')}<tr class="total"><td>Итого в месяц</td><td>${rub(total)}</td></tr></table>
      <p class="price" style="color:var(--terra-deep)">${rub(total)}<span style="font-family:var(--f-text);font-size:15px;color:var(--ink-3)"> / мес</span></p>
      <p class="note">Условные расценки для демонстрации.</p>`;
  };
  app.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',calc));
  calc();
}

function wireNoah(){
  const chat = document.getElementById('noahChat');
  const ask = i => { const x = NOAH[i];
    chat.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(x.q)}</div>`);
    setTimeout(()=>{ chat.insertAdjacentHTML('beforeend', `<div class="msg bot">${esc(x.a)}<span class="src">Источник: ${esc(x.s)}</span></div>`); trim(); }, 650);
  };
  const trim = () => { while(chat.children.length>6) chat.firstElementChild.remove(); };
  document.getElementById('noahQ').addEventListener('click',e=>{ const b=e.target.closest('[data-q]'); if(b) ask(+b.dataset.q); });
  chat.innerHTML = `<div class="msg me">${esc(NOAH[0].q)}</div><div class="msg bot">${esc(NOAH[0].a)}<span class="src">Источник: ${esc(NOAH[0].s)}</span></div>`;
}

const WEEK = [
  ['ПН',[['reels','Reels: «3 налога до 1 декабря»']]],
  ['ВТ',[['car','Карусель: чек-лист сроков'],['story','Сторис: опрос']]],
  ['СР',[['text','Пост: разбор вопроса клиента']]],
  ['ЧТ',[['reels','Reels: ответ на комментарий'],['story','Сторис: за кадром']]],
  ['ПТ',[['car','Карусель: ошибки в УПД']]],
  ['СБ',[['story','Сторис: итоги недели']]],
  ['ВС',[['text','Пост: личная история']]]
];
function wireContent(){
  app.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; contentTab=b.dataset.tab;
    app.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
    const body = document.getElementById('ctBody'); body.innerHTML = CTV[contentTab](); wireSub(); });

}
function wireSub(){
  document.querySelectorAll('#ctBody [data-copy-prev]').forEach(b=>b.addEventListener('click',()=>copy(b.previousElementSibling.textContent,b)));
  const week = document.getElementById('week');
  if(week){
    week.innerHTML = WEEK.map((d,i)=>`<button class="day" data-day="${i}" style="text-align:left;font:inherit;color:inherit"><span class="d">${d[0]}</span>${d[1].map(p=>`<span class="post ${p[0]}">${p[1]}</span>`).join('')}</button>`).join('');
    week.addEventListener('click',e=>{ const b=e.target.closest('[data-day]'); if(!b) return; b.querySelectorAll('.post').forEach(p=>{p.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:350});}); b.style.borderColor='var(--blue)'; });
  }
  const m = document.getElementById('metrics');
  if(m){
    const M = [
      ['Охват','сколько людей увидели','Статистика Instagram / Telegram / VK'],
      ['Досмотры Reels','держит ли начало ролика','Статистика ролика'],
      ['Сохранения и репосты','польза контента','Статистика публикации'],
      ['Переходы на сайт','интерес к услугам','Яндекс Метрика'],
      ['Заявки','пишут ли вам','Мессенджеры и CRM'],
      ['Клиенты из соцсетей','деньги, а не лайки','Ваш учёт']
    ];
    m.innerHTML = M.map((x,i)=>`<div class="metric"><h3>${x[0]}</h3><p class="muted" style="font-size:14px">${x[1]}</p><div style="display:flex;gap:8px;align-items:center"><label class="note" for="mt${i}">Прошлая</label><input type="number" id="mt${i}" min="0" placeholder="—"><label class="note" for="mn${i}">Эта</label><input type="number" id="mn${i}" min="0" placeholder="—"></div><div class="bar-m"><i id="mb${i}" style="width:0%"></i></div><p class="note" id="mr${i}">${x[2]}</p></div>`).join('');
    M.forEach((x,i)=>{ const upd=()=>{ const a=+document.getElementById('mt'+i).value||0, b=+document.getElementById('mn'+i).value||0; const bar=document.getElementById('mb'+i), r=document.getElementById('mr'+i);
      if(a>0 && b>=0){ const d=Math.round((b-a)/a*100); bar.style.width=Math.min(100,Math.max(4,b/Math.max(a,b)*100))+'%'; bar.style.background = d>=0?'var(--blue)':'var(--terra)'; r.textContent = (d>=0?'Рост +':'Снижение ')+d+'% · '+x[2]; } else { bar.style.width='0%'; r.textContent=x[2]; } };
      ['mt','mn'].forEach(p=>document.getElementById(p+i).addEventListener('input',upd)); });
  }
}

function wireOnec(){
  const chat = document.getElementById('onecChat');
  let timers = [];
  const today = new Date().toLocaleDateString('ru-RU');
  const item = s => s.t==='doc'
    ? `<div class="doc"><p class="who">Документ в 1С</p><b>Счёт на оплату № [номер] от ${today}</b><p style="margin-top:6px">Покупатель: ООО «ДЕМО ТОРГ»<br>Консультация по налогам · 2 ч<br>Сумма — по прайсу в 1С</p><p class="note" style="margin-top:6px">Создан через OData · ждёт проверки бухгалтера</p></div>`
    : `<div class="msg ${s.t}"><span class="who" style="display:block;margin-bottom:3px">${s.who}</span>${esc(s.x)}</div>`;
  const reset = () => { timers.forEach(clearTimeout); timers=[]; chat.innerHTML = `<p class="muted" style="margin:auto;text-align:center">Нажмите «Запустить пример»</p>`; };
  const play = () => { reset(); chat.innerHTML=''; ONEC.forEach((s,i)=>timers.push(setTimeout(()=>chat.insertAdjacentHTML('beforeend', item(s)), 200 + i*1300))); };
  document.getElementById('onecPlay').addEventListener('click',play);
  document.getElementById('onecReset').addEventListener('click',reset);
  chat.innerHTML = ONEC.map(item).join('');
}

/* reels player */
let player = null, pSet = [], pIdx = 0, lastFocus = null;
function openReel(id, set){
  pSet = set; pIdx = Math.max(0, set.indexOf(id)); lastFocus = document.activeElement;
  if(!player){
    player = document.createElement('div'); player.className = 'player'; player.setAttribute('role','dialog'); player.setAttribute('aria-modal','true'); player.hidden = true;
    player.innerHTML = `<button class="x" id="pX">Закрыть ✕</button><div class="player-in"><video id="pV" controls playsinline></video><p id="pT"></p><div class="nav"><button class="btn" id="pPrev">← Назад</button><button class="btn blue" id="pNext">Следующий →</button></div></div>`;
    document.body.appendChild(player);
    player.addEventListener('click', e=>{ if(e.target===player) closeReel(); });
    player.querySelector('#pX').addEventListener('click', closeReel);
    player.querySelector('#pPrev').addEventListener('click', ()=>stepReel(-1));
    player.querySelector('#pNext').addEventListener('click', ()=>stepReel(1));
  }
  player.hidden = false; showReel(); player.querySelector('#pX').focus();
}
function showReel(){
  const id = pSet[pIdx], v = player.querySelector('#pV');
  v.src = `${id}.mp4`; v.poster = `${id}.jpg`;
  player.querySelector('#pT').textContent = REELS[id][0];
  player.querySelector('#pPrev').hidden = pSet.length<2; player.querySelector('#pNext').hidden = pSet.length<2;
  const p = v.play(); if(p) p.catch(()=>{});
}
function stepReel(d){ pIdx = (pIdx + d + pSet.length) % pSet.length; showReel(); }
function closeReel(){ if(!player) return; const v = player.querySelector('#pV'); v.pause(); v.removeAttribute('src'); v.load(); player.hidden = true; if(lastFocus) lastFocus.focus(); }
document.addEventListener('click', e=>{ const b = e.target.closest('[data-reel]'); if(b) openReel(b.dataset.reel, b.dataset.set.split(',')); });

addEventListener('hashchange', ()=>{ closeReel(); render(); });
addEventListener('keydown', e=>{
  if(player && !player.hidden){ if(e.key==='Escape') closeReel(); if(e.key==='ArrowRight') stepReel(1); if(e.key==='ArrowLeft') stepReel(-1); return; }
  if(e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = ROUTES.findIndex(r=>r.id===current());
  if(e.key==='ArrowRight' && i<ROUTES.length-1) location.hash = ROUTES[i+1].id;
  if(e.key==='ArrowLeft' && i>0) location.hash = ROUTES[i-1].id;
});
render();
})();
</script>
